<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StayEase{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <script src="https://cdn.tailwindcss.com"></script> 
</head>

<body class="bg-gray-50 text-gray-900">

<nav class="bg-white/80 backdrop-blur-md border-b border-gray-200 fixed w-full z-50 top-0">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16 items-center">
      
      <div class="flex-shrink-0 flex items-center">
        <a href="{% url 'rooms:room_list' %}" class="text-2xl font-black text-blue-600 tracking-tighter">StayEase</a>
      </div>

      <div class="flex-1 max-w-md mx-8 hidden sm:block">
        <form action="{% url 'rooms:room_search' %}" method="GET" class="relative group">
          <input type="text" name="q" value="{{ request.GET.q }}" placeholder="Search rooms, types, or floors..." 
                 class="w-full bg-gray-50 border border-gray-200 rounded-2xl py-2 px-4 pl-10 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
          <div class="absolute left-3 top-2.5 text-gray-400 group-focus-within:text-blue-500 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
        </form>
      </div>

      <div class="hidden md:flex space-x-6 items-center">
      {% if user.is_authenticated %}
        <a href="{% url 'accounts:profile' %}" class="text-sm font-medium text-gray-700 hover:text-blue-600 transition-colors">
            Profile ({{ user.username }})
        </a>
        <a href="{% url 'accounts:logout' %}" class="bg-gray-900 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-black transition-all">
            Logout
        </a>
      {% else %}
        <a href="{% url 'accounts:login' %}" class="text-sm font-medium text-gray-700 hover:text-blue-600">Login</a>
        <a href="{% url 'accounts:register' %}" class="bg-blue-600 text-white px-5 py-2 rounded-xl text-sm font-bold hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all">
            Sign Up
        </a>
      {% endif %}
      </div>
    </div>
  </div>
</nav>

<main class="pt-24 max-w-screen-xl mx-auto p-4 min-h-screen">
    {% block content %}
    {% endblock %}
</main>

<footer class="py-10 text-center text-gray-400 text-xs">
    &copy; 2026 StayEase Hotel Management System
</footer>

</body>
</html>
