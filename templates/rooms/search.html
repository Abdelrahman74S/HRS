{% extends 'base.html' %}
{% block content %}
<div class="max-w-6xl mx-auto py-12 px-4">
    <h1 class="text-4xl font-black text-gray-900 mb-10">Find Your Room</h1>
    
    <form method="GET" action="{% url 'rooms:room_search' %}" class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-gray-50 grid grid-cols-1 md:grid-cols-4 gap-6 mb-12">
        <div>
            <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest block mb-2">Search</label>
            <input type="text" name="q" value="{{ q }}" placeholder="Room number or type..." class="w-full rounded-2xl border-gray-100 py-3 px-4 text-sm">
        </div>
        <div>
            <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest block mb-2">Check-in</label>
            <input type="date" name="check_in" value="{{ check_in|date:'Y-m-d' }}" class="w-full rounded-2xl border-gray-100 py-3 px-4 text-sm">
        </div>
        <div>
            <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest block mb-2">Check-out</label>
            <input type="date" name="check_out" value="{{ check_out|date:'Y-m-d' }}" class="w-full rounded-2xl border-gray-100 py-3 px-4 text-sm">
        </div>
        <div class="flex items-end">
            <button type="submit" class="w-full bg-blue-600 text-white font-black py-3 rounded-2xl hover:bg-blue-700 transition-all">
                Search Availability
            </button>
        </div>
    </form>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        {% for room in rooms %}
            <div class="bg-white rounded-[2rem] shadow-md border border-gray-50 overflow-hidden p-6">
                <h3 class="font-black text-xl mb-2">Room {{ room.room_number }}</h3>
                <p class="text-gray-500 text-sm mb-4">{{ room.room_type.name }}</p>
                <a href="{% url 'rooms:room_detail' room.slug %}" class="text-blue-600 font-bold text-sm uppercase tracking-widest">View Details</a>
            </div>
        {% empty %}
            <p class="col-span-3 text-center text-gray-400 font-bold py-20">No rooms available for these dates or criteria.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
