{% extends 'base.html' %}

{% block title %}Cancel Reservation{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto py-24 px-4 text-center">
    <div class="bg-white p-12 rounded-[3rem] shadow-2xl border border-red-50">
        <div class="w-20 h-20 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-8">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
        </div>
        
        <h1 class="text-3xl font-black text-gray-900 mb-4">Cancel Reservation?</h1>
        <p class="text-gray-500 mb-10 leading-relaxed">
            Are you sure you want to cancel booking <span class="font-bold text-gray-900">#{{ object.reservation_number }}</span>? 
            This action cannot be undone.
        </p>
        
        <form method="POST" class="flex flex-col gap-4">
            {% csrf_token %}
            <button type="submit" class="w-full bg-red-600 text-white font-black py-5 rounded-2xl hover:bg-red-700 shadow-xl shadow-red-100 transition-all">
                Yes, Cancel Booking
            </button>
            <a href="{% url 'reservations:booking_detail' object.pk %}" class="w-full bg-gray-100 text-gray-500 font-bold py-5 rounded-2xl hover:bg-gray-200 transition-all">
                No, Keep Reservation
            </a>
        </form>
    </div>
</div>
{% endblock %}
